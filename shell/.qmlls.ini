# QML Language Server configuration for the Quickshell shell.
# qmlls auto-discovers this file walking up from each .qml buffer.
# See https://doc.qt.io/qt-6/qtqml-tooling-qmlls.html
[General]
# This is a Quickshell project, not a CMake one: don't try to invoke cmake
# to locate a build directory (there is none).
no-cmake-calls=true
# Import paths for Quickshell.* / QtQuick resolution come from
# QML_IMPORT_PATH, set in devenv.nix and honored because the editor invokes
# `qmlls -E'. Quickshell's `qs.*' local-module prefix is a runtime alias the
# plain Qt engine (and thus qmlls) does not natively resolve, so cross-file
# `qs.*' completion is best-effort; Quickshell and Qt types resolve fully.
