# qmllint configuration for the omarchy plugin compat shim (shell/compat).
# qmllint auto-discovers the closest .qmllint.ini walking up from each file, so
# this overrides shell/.qmllint.ini for the compat tree only.
#
# Unlike the first-party shell, MissingProperty is a resolution artifact here,
# not a crash-class signal: the vendored omarchy host types reach their host
# through a dynamically-typed `bar` facade (property QtObject) and expose grouped
# tokens (Style.font.*, Style.bar.*, Color.popups.*, spacing.*) as inline
# QtObjects, neither of which qmllint can introspect. It is disabled here for the
# same reason shell/.qmllint.ini disables UnqualifiedAccess et al: a resolution
# limit, not an actionable defect. The runtime harness (shell/Justfile check) and
# a live shell remain the real validators for this vendored code.
[General]
MaxWarnings=0

[Warnings]
MissingProperty=disable
UnqualifiedAccess=disable
UnresolvedType=disable
UncreatableType=disable
MissingType=disable
BadSignalHandlerParameters=disable
PropertyOverride=disable
