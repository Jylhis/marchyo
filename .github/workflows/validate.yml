name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly run of everything, including the heavy build checks.
  schedule:
    - cron: '37 3 * * 1'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Format check
        run: nix fmt -- --ci
  # Fast PR gate: x86_64-linux eval-only checks. Runs on every PR and main push.
  check:
    name: Check (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: jylhis
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix flake check --accept-flake-config
  # Full NixOS toplevel build. Main-only — up to 60 minutes per run.
  build:
    name: Build toplevel
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [lint, check]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: jylhis
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Build toplevel
        run: nix build --accept-flake-config .#nixosConfigurations.x86_64.config.system.build.toplevel
  # The heavy checks (legacyPackages.<system>.heavyChecks): Hyprland
  # --verify-config runs, theme asset builds, the Plymouth theme and shell
  # wrapper builds, the installer ISO evaluations. Too slow for the PR gate;
  # weekly and on manual dispatch (`just check-full` locally).
  heavy:
    name: Heavy checks (x86_64-linux)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: jylhis
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Build heavy checks
        run: |
          set -euo pipefail
          heavy=".#legacyPackages.x86_64-linux.heavyChecks"
          mapfile -t names < <(nix eval --accept-flake-config --raw "$heavy" \
            --apply 'c: builtins.concatStringsSep "\n" (builtins.attrNames c)')
          nix build --accept-flake-config --no-link -L "${names[@]/#/$heavy.}"
  # The single required status check. Skipped jobs (main-only, schedule-only)
  # do not fail it.
  gate:
    name: Gate
    if: always()
    runs-on: ubuntu-latest
    needs: [lint, check, build, heavy]
    timeout-minutes: 5
    steps:
      - name: Require every needed job to have succeeded or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) echo "a needed job ended as: $r" >&2; exit 1 ;;
            esac
          done
