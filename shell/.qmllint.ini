# qmllint configuration for the marchyo shell (auto-discovered by qmllint, and
# passed explicitly by the treefmt `qmllint` formatter).
#
# The point of this gate is to catch the class of bug that crash-loops the shell
# at load: assigning a non-existent property (e.g. a `displaced`/`remove`
# transition on a Column positioner, or `opacity` on a Quickshell PanelWindow).
# That is the MissingProperty category, kept at `warning` so it fails the run.
#
# Everything below that is set to `disable` is a *resolution* limitation, not a
# real defect: qmllint cannot fully load Quickshell's C++-registered types
# (PanelWindow, the Services.* singletons, Hyprland/Pipewire/UPower bindings), so
# it reports their types as unresolved/uncreatable, their inherited members as
# missing types, their signal handlers as malformed, and the shell's deliberate
# unqualified singleton access (Color, Style, PanelManager, …) as errors. None of
# those are actionable here, and left at `warning` they would bury the real one.

# MaxWarnings=0: any warning-level finding fails the run (exit non-zero). Info
# stays informational. Without this qmllint reports warnings but still exits 0.
[General]
MaxWarnings=0

[Warnings]
# Keep: the real crash-class. Genuine false positives (e.g. Qt.formatDateTime,
# which qmllint's Qt global model omits) are suppressed inline at the call site.
MissingProperty=warning

# Disable: artefacts of qmllint not resolving Quickshell's C++ types.
UnqualifiedAccess=disable
UnresolvedType=disable
UncreatableType=disable
MissingType=disable
BadSignalHandlerParameters=disable
PropertyOverride=disable
