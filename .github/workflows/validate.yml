name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly run of everything, including the heavy build checks.
  schedule:
    - cron: '37 3 * * 1'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Format check
        run: nix fmt -- --ci
  # Fast PR gate: x86_64-linux eval-only checks. Runs on every PR and main push.
  check:
    name: Check (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix flake check --accept-flake-config
  # aarch64-linux eval coverage. Main-only — rarely diverges from x86_64 and
  # would otherwise waste a runner on every PR push.
  check-arm:
    name: Check (aarch64-linux)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix flake check --accept-flake-config
  # Full NixOS toplevel build. Main-only — up to 60 minutes per run.
  build:
    name: Build toplevel
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [lint, check]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Build toplevel
        run: nix build --accept-flake-config .#nixosConfigurations.x86_64.config.system.build.toplevel
  # The heavy checks (legacyPackages.<system>.heavyChecks): Hyprland
  # --verify-config runs, theme asset builds, the Plymouth theme and shell
  # wrapper builds, the installer ISO evaluations. Too slow for the PR gate;
  # weekly and on manual dispatch (`just check-full` locally).
  heavy:
    name: Heavy checks (x86_64-linux)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Build heavy checks
        run: |
          set -euo pipefail
          heavy=".#legacyPackages.x86_64-linux.heavyChecks"
          mapfile -t names < <(nix eval --accept-flake-config --raw "$heavy" \
            --apply 'c: builtins.concatStringsSep "\n" (builtins.attrNames c)')
          nix build --accept-flake-config --no-link -L "${names[@]/#/$heavy.}"
